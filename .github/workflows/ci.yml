name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run docs:build

  # The docs site is published to GitHub Pages only from main, after the checks pass.
  # One-time setup: repository Settings → Pages → Source: "GitHub Actions".
  docs-build:
    name: Build docs for GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages has no SPA rewrites: serving index.html as the 404 page lets
      # deep links like /components/button load the app, which then routes them.
      - run: cp docs/dist/index.html docs/dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  docs-deploy:
    name: Deploy docs
    needs: docs-build
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's, so list every one this job needs.
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
